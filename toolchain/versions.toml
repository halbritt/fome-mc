# Pinned toolchain for fome-mc. `toolchain/bootstrap.sh` installs exactly these;
# `make doctor` fails when anything installed differs.
#
# Python packages are pinned separately in toolchain/pyproject.toml + uv.lock.

[apt]
# Ubuntu 24.04 (noble). kicad* come from ppa:kicad/kicad-10.0-releases (stable 10.0
# series); everything else from the Ubuntu archive.
kicad = "10.0.7~ubuntu24.04.1"
kicad-symbols = "10.0.7~ubuntu24.04.1"
kicad-footprints = "10.0.7~ubuntu24.04.1"
kicad-templates = "10.0.7~ubuntu24.04.1"
ngspice = "42+ds-3build1"            # standalone ngspice CLI (KiCad links libngspice0 42)
poppler-utils = "24.02.0-1ubuntu9.10" # pdftotext / pdftoppm / pdfinfo for datasheets
mupdf-tools = "1.23.10+ds1-1build3"   # mutool (page render / text extraction fallback)
librsvg2-bin = "2.58.0+dfsg-1ubuntu0.1" # rsvg-convert, needed by KiBot pcb_print PDF
ghostscript = "10.02.1~dfsg1-0ubuntu7.9"
"python3-wxgtk4.0" = "4.2.1+dfsg-3build2" # wx; KiBot imports it, KiCad's pcbnew is built against it

[tools]
kicad_cli_version = "10.0.7"
ngspice_version = "42"
kibot_version = "1.9.1"
kiauto_version = "2.3.10"
python = "3.12"

[upstream.kicad-happy]
url = "https://github.com/aklofas/kicad-happy.git"
tag = "v2.3.1"
commit = "06840467ad0f5d76af45f64449b1f5ecb10f052f"
license = "MIT"
# Skills exposed to agents (renamed with a kicad-happy- prefix; see toolchain/sync_skills.py).
skills = ["kicad", "spice", "datasheets"]

[upstream.agent-ee]
# The one agent-ee pin for scripts/verify_io_map.py (the hardware_interface evaluator and the
# AGENTEE-188 io_map compiler and qualification-record loader). scripts/agent_ee_pin.py exports
# exactly this commit's src/ from the local checkout into build/agent-ee/<commit>/.
# DEVELOPMENT PIN: e906c9c7 is the AGENTEE-188 commit accepted by agent-521 (35ff0e93, coordinator
# decision) and is not yet on agent-ee main. Before fome-mc lands, move `commit` to the landed
# agent-ee main commit that contains e906c9c7 (the integrator supplies that SHA).
repo = "~/git/agent-ee"
commit = "e906c9c7546043e75e45009de5bc08990c470e93"
status = "development"

[libraries.fome]
# FOME-Tech/kicad-libraries: the shared library repository. Polygonus-Universal-112
# pins it as the `fome-kicad-libs` submodule; fome-mc references it as ../kicad-libraries.
path = "~/git/kicad-libraries"
url = "https://github.com/FOME-Tech/kicad-libraries.git"

[projects.fixture]
description = "RC low-pass toolchain fixture (not the ECU design)"
dir = "toolchain/fixtures/rc_filter"
schematic = "rc_filter.kicad_sch"
pcb = "rc_filter.kicad_pcb"

[projects.fome-mc]
description = "FOME-MC integrated motorcycle ECU (STM32H753 + 2x STM32F042 WBO)"
dir = "."
schematic = "fome-mc.kicad_sch"
pcb = "fome-mc.kicad_pcb"

[projects.telemetry-pod]
description = "Tail-cowl CAN1 telemetry pod (skeleton; design generated by agent-ee)"
dir = "telemetry-pod"
schematic = "telemetry-pod.kicad_sch"
pcb = "telemetry-pod.kicad_pcb"

[projects.universal-112]
description = "Polygonus Universal 112 dual-WBO base board (electrical baseline donor)"
dir = "~/git/Polygonus-Universal-112"
schematic = "Polygonus-Universal-Base.kicad_sch"
pcb = "Polygonus-Universal-Base.kicad_pcb"
# The donor's fome-kicad-libs submodule is not initialised; map it to the shared
# library repository. Doctor/baseline record whether the commits match.
[projects.universal-112.library_dirs]
fome-kicad-libs = "fome"
